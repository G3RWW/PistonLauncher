<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Piston Overlay</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      html, body {
        background: transparent;
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="overlay-shell">
      <div class="overlay-hint-bar">
        <span class="overlay-hint">Esc to hide</span>
      </div>
      <div id="overlay-canvas" class="overlay-canvas"></div>
      <div id="overlay-dock" class="overlay-dock"></div>
    </div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
