<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Piston Overlay</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      html, body {
        background: transparent;
        margin: 0;
        height: 100%;
        -webkit-app-region: drag;
      }
    </style>
  </head>
  <body>
    <div class="overlay-panel" style="-webkit-app-region: no-drag;">
      <div class="overlay-hint-bar">
        <span class="overlay-hint">Esc to hide</span>
      </div>
      <div id="overlay-body" class="overlay-body"></div>
    </div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
