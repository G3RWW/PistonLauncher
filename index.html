<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Piston Launcher</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h1 class="logo">Piston Launcher</h1>

        <nav id="category-nav"></nav>
      </aside>

      <div id="content-area">
        <header id="app-header">
          <div class="header-left">
            <div class="header-nav">
              <a href="#" id="home-link" class="header-nav-link">Library</a>
              <a href="#" id="stats-link" class="header-nav-link">Stats</a>
              <a href="#" id="habit-link" class="header-nav-link">Habit</a>
            </div>

            <div class="menu-bar">
              <div class="menu" data-menu="file">
                <button class="menu-trigger">File</button>
                <div class="menu-dropdown">
                  <button id="open-add-panel-btn">Add Apps</button>
                  <button id="export-data-btn">Export Data...</button>
                  <button id="import-data-btn">Import Data...</button>
                </div>
              </div>
              <div class="menu" data-menu="categories">
                <button class="menu-trigger">Categories</button>
                <div class="menu-dropdown">
                  <button id="new-category-btn">New Category</button>
                </div>
              </div>
              <div class="menu" data-menu="settings">
                <button class="menu-trigger">Settings</button>
                <div class="menu-dropdown">
                  <button id="settings-btn">Preferences...</button>
                </div>
              </div>
              <div class="menu" data-menu="help">
                <button class="menu-trigger">Help</button>
                <div class="menu-dropdown">
                  <button id="about-btn">About</button>
                </div>
              </div>
            </div>
          </div>

          <div id="running-bar" class="running-bar hidden"></div>
        </header>

        <main id="main">
          <section id="recent-section">
            <h2>Recently Played</h2>
            <div id="recent-grid" class="grid"></div>
          </section>

          <div id="library"></div>

          <div id="app-detail" class="hidden"></div>

          <div id="app-stats" class="hidden"></div>

          <div id="app-habit" class="hidden"></div>
        </main>
      </div>
    </div>

    <!-- Ctrl+Space quick-launch overlay -->
    <div id="quick-launch-modal" class="modal hidden">
      <div class="modal-content quick-launch-content">
        <input id="quick-launch-input" type="text" placeholder="Type to search apps... (Esc to close)" />
        <div id="quick-launch-results"></div>
      </div>
    </div>

    <!-- Add apps popout panel -->
    <div id="add-panel-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Add Apps</h2>

        <div id="drop-zone">Drag a .exe here to add it</div>

        <div class="toolbar">
          <button id="scan-btn">Scan Installed Apps</button>
          <button id="toggle-manual-btn">Add manually</button>
        </div>

        <form id="add-form" class="hidden">
          <input id="input-name" type="text" placeholder="App name" required />
          <input id="input-path" type="text" placeholder="Full path to .exe" required />
          <input id="input-category" type="text" placeholder="Category" required />
          <button type="submit">Add App</button>
        </form>

        <div class="modal-actions">
          <button id="add-panel-close-btn">Close</button>
        </div>
      </div>
    </div>

    <!-- Bulk-add from Start Menu scan -->
    <div id="scan-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Select apps to add</h2>
        <input id="scan-filter" type="text" placeholder="Filter..." />
        <div id="scan-list"></div>
        <div class="modal-actions">
          <button id="scan-cancel-btn">Cancel</button>
          <button id="scan-add-btn">Add Selected</button>
        </div>
      </div>
    </div>

    <!-- Generic custom dialog: replaces native prompt()/confirm() -->
    <div id="dialog-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="dialog-title"></h2>
        <p id="dialog-message"></p>
        <input id="dialog-input" type="text" class="hidden" />
        <div class="modal-actions">
          <button id="dialog-cancel-btn">Cancel</button>
          <button id="dialog-ok-btn">OK</button>
        </div>
      </div>
    </div>

    <!-- Settings: Sound, Themes, Shortcuts -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-content settings-content">
        <h2>Settings</h2>

        <div class="settings-body">
          <div class="settings-tabs">
            <button class="settings-tab active" data-tab="sound">Sound</button>
            <button class="settings-tab" data-tab="themes">Themes</button>
            <button class="settings-tab" data-tab="shortcuts">Shortcuts</button>
          </div>

          <div class="settings-panels">
            <div id="settings-panel-sound" class="settings-panel active"></div>

            <div id="settings-panel-themes" class="settings-panel">
              <p class="theme-active-label">Active: <span id="active-theme-label"></span></p>

              <div class="theme-section-label">System</div>
              <div class="theme-options">
                <button class="theme-swatch" data-theme-name="Blueprint">Blueprint</button>
                <button class="theme-swatch" data-theme-name="Steam">Steam</button>
                <button class="theme-swatch" data-theme-name="Midnight">Midnight</button>
              </div>

              <div class="theme-section-label">Custom</div>
              <div id="custom-theme-list" class="custom-theme-list"></div>
              <button id="load-theme-file-btn" class="load-theme-file-btn">+ Add Custom Theme File (.css)...</button>
            </div>

            <div id="settings-panel-shortcuts" class="settings-panel">
              <div id="hotkeys-list" class="hotkeys-list"></div>
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button id="settings-close-btn">Close</button>
        </div>
      </div>
    </div>

    <!-- About -->
    <div id="about-modal" class="modal hidden">
      <div class="modal-content">
        <h2>About</h2>
        <div id="about-body" class="about-body"></div>
        <div class="modal-actions">
          <button id="about-close-btn">Close</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
